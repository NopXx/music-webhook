<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Music Webhook</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;460;540;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #1b1938; --primary-deep: #0e0c1f; --on-primary: #ffffff;
        --ink: #292827; --ink-mute: #73706d; --ink-faint: #9a9794;
        --canvas: #ffffff; --canvas-soft: #fafaf8;
        --violet-soft: #c9b4fa; --teal-deep: #0c2c4a;
        --hairline: #e8e4dd; --hairline-dark: #3f3a52;
        --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
      }
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 460; margin: 0; min-height: 100dvh; color: var(--on-primary);
        background: var(--primary-deep);
        background-image:
          radial-gradient(900px 600px at 78% 8%, color-mix(in srgb, var(--violet-soft) 55%, transparent), transparent 60%),
          radial-gradient(700px 500px at 12% 92%, color-mix(in srgb, #6d5cc9 45%, transparent), transparent 60%),
          linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%);
        -webkit-font-smoothing: antialiased;
        display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 24px; padding: 48px;
      }
      @media (max-width: 860px){ body { grid-template-columns: 1fr; padding: 32px 24px; } }

      .hero { max-width: 460px; justify-self: end; padding-right: 24px; }
      @media (max-width: 860px){ .hero { justify-self: start; padding-right: 0; max-width: 520px; } }
      .hero .mark { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 32px; font-weight: 540; font-size: 15px; color: var(--violet-soft); }
      .hero .mark .logo { width: 34px; height: 34px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--violet-soft); color: var(--primary); }
      .hero h1 { font-size: 56px; line-height: 0.96; letter-spacing: -1.32px; font-weight: 540; margin: 0 0 20px; }
      @media (max-width: 860px){ .hero h1 { font-size: 40px; } }
      .hero p { font-size: 18px; font-weight: 460; line-height: 1.5; color: var(--on-primary); opacity: 0.72; margin: 0; max-width: 40ch; }

      .card { width: 100%; max-width: 400px; background: var(--canvas); color: var(--ink);
        border-radius: var(--r-lg); padding: 32px; justify-self: start; box-shadow: 0 24px 60px -20px rgba(0,0,0,0.5); }
      @media (max-width: 860px){ .card { justify-self: stretch; } }
      .card h2 { font-size: 22px; font-weight: 540; letter-spacing: -0.315px; margin: 0 0 4px; }
      .card .sub { color: var(--ink-mute); font-size: 15px; margin: 0 0 24px; }

      .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--canvas-soft); padding: 4px; border-radius: var(--r-full); border: 1px solid var(--hairline); }
      .tab { flex: 1; padding: 8px; text-align: center; border-radius: var(--r-full); cursor: pointer;
        background: transparent; border: none; color: var(--ink-mute); font: inherit; font-weight: 600; font-size: 14px;
        transition: background .16s ease, color .16s ease; }
      .tab.active { background: var(--primary); color: var(--on-primary); }

      label { display: block; font-size: 14px; color: var(--ink-mute); margin: 0 0 6px; font-weight: 540; }
      input { width: 100%; height: 44px; padding: 0 12px; margin-bottom: 16px; border-radius: var(--r-sm);
        border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink); font: inherit; font-size: 16px;
        transition: border-color .16s ease; }
      input:focus { outline: none; border-color: var(--primary); }
      button.submit { width: 100%; height: 44px; border: none; border-radius: var(--r-md); cursor: pointer;
        background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 700; font-size: 16px;
        transition: background .16s ease; }
      button.submit:hover { background: var(--primary-deep); }
      button.submit:disabled { opacity: 0.55; cursor: not-allowed; }
      .msg { font-size: 14px; margin-top: 16px; text-align: center; min-height: 1.2em; }
      .msg.error { color: #b42318; }
      .msg.ok { color: #0c2c4a; }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; } }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="mark">
        <span class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        Music Webhook
      </div>
      <h1>Your listening, quietly captured.</h1>
      <p>Every scrobble from Web Scrobbler, ListenBrainz, or Apple Music — normalized, enriched, and yours.</p>
    </div>

    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">Access your dashboard and API keys.</p>

      <div class="tabs">
        <button class="tab active" data-mode="login">Log in</button>
        <button class="tab" data-mode="register">Register</button>
      </div>

      <form id="form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        <button class="submit" type="submit" id="submit">Log in</button>
      </form>

      <div class="msg" id="msg"></div>
    </div>

    <script>
      let mode = 'login';
      const tabs = document.querySelectorAll('.tab');
      const submitBtn = document.getElementById('submit');
      const msg = document.getElementById('msg');
      const form = document.getElementById('form');

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          mode = tab.dataset.mode;
          tabs.forEach((t) => t.classList.toggle('active', t === tab));
          submitBtn.textContent = mode === 'login' ? 'Log in' : 'Register';
          msg.textContent = '';
          msg.className = 'msg';
        });
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        submitBtn.disabled = true;
        msg.textContent = '';
        msg.className = 'msg';

        try {
          const res = await fetch('/api/auth/' + mode, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            msg.textContent = data.message || 'Something went wrong';
            msg.className = 'msg error';
            return;
          }
          // Token is also set as an httpOnly cookie; keep a copy for API clients / Bearer use.
          if (data.token) localStorage.setItem('token', data.token);
          msg.textContent = 'Success — redirecting…';
          msg.className = 'msg ok';
          const params = new URLSearchParams(location.search);
          location.href = params.get('next') || '/dashboard';
        } catch (err) {
          msg.textContent = 'Network error';
          msg.className = 'msg error';
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
